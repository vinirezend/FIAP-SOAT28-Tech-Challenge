services:
  api:
    image: oficina-api:latest
    build:
      context: .
      dockerfile: Oficina.Api/Dockerfile
    container_name: oficina-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-oficina};Username=${POSTGRES_USER:-oficina};Password=${POSTGRES_PASSWORD:-oficina}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-oficina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts executados (em ordem alfabética) apenas na primeira inicialização do banco
      - ${DB_INIT_SCRIPTS_PATH:-./database/init}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Via TCP (-h 127.0.0.1): durante a execução dos scripts de init o Postgres aceita apenas socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
