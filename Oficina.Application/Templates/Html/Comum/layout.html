<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{titulo}}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #333; }
        .botao { color: #fff; border: 0; border-radius: 4px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
        .botao-aprovar { background: #2e7d32; }
        .botao-recusar { background: #c62828; }
        .status { background: #e3f2fd; border-radius: 4px; padding: 12px 16px; margin: 16px 0; }
        .status p { margin: 0 0 4px; }
        .etapas { list-style: none; padding: 0; margin: 24px 0; }
        .etapa { padding: 8px 0; border-bottom: 1px solid #eee; color: #9e9e9e; }
        .etapa::before { display: inline-block; width: 24px; content: "\25CB"; }
        .etapa-concluida { color: #2e7d32; }
        .etapa-concluida::before { content: "\2713"; }
        .etapa-atual { color: #1565c0; font-weight: bold; }
        .etapa-atual::before { content: "\25CF"; }
        .etapa-naorealizada::before { content: "\2013"; }
        .etapa .data { float: right; font-weight: normal; color: #777; }
        .rodape { font-size: 12px; color: #777; }
    </style>
</head>
<body>
{{conteudo}}
</body>
</html>
