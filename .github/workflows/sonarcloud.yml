name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Build, testes e análise SonarCloud
    runs-on: ubuntu-latest

    env:
      SONAR_ORGANIZATION: vinirezend
      SONAR_PROJECT_KEY: vinirezend_FIAP-SOAT28-Tech-Challenge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo melhora a análise (blame / new code)

      - name: Setup Java 17 (requerido pelo scanner)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache dos pacotes do SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_ACESS_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT_KEY }}"
          /o:"${{ env.SONAR_ORGANIZATION }}"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/Oficina.Tests/**,**/Program.cs,**/Migrations/**"

      - name: Build
        run: dotnet build Oficina.slnx --configuration Release

      - name: Testes com cobertura
        run: >
          dotnet test Oficina.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Finalizar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_ACESS_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
